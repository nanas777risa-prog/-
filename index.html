<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lena消消消</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fce7f3;
            touch-action: manipulation;
            user-select: none;
        }
        
        #game-board {
            display: grid;
            gap: 4px;
            background-color: #fbcfe8;
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .tile {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: white;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden; /* 确保图片不超出圆角 */
        }

        /* 图片样式优化：增强亮度，填满容器 */
        .tile img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(1.15) contrast(1.05); /* 增强亮度和对比度 */
            pointer-events: none;
        }

        .tile:hover:not(:empty) {
            transform: scale(1.05);
            background-color: #fef08a;
            z-index: 10;
        }

        .tile.empty {
            background-color: transparent;
            box-shadow: none;
        }

        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(0); opacity: 0; }
        }

        .popping {
            animation: pop 0.3s ease-out forwards;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center font-sans">

    <audio id="sound-click" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <audio id="sound-pop" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="sound-win" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

    <div class="max-w-md w-full p-4 flex flex-col items-center">
        <div class="w-full flex justify-between items-end mb-4 px-2">
            <div>
                <h1 class="text-2xl font-black text-pink-600 drop-shadow-sm">降智点点消</h1>
                <p class="text-sm text-pink-400 font-bold">点相连的同款头像！</p>
            </div>
            <div class="text-right">
                <p class="text-sm text-gray-500 font-bold">分数</p>
                <p id="score" class="text-3xl font-black text-pink-500">0</p>
            </div>
        </div>

        <div id="game-board" class="w-full max-w-[400px]"></div>

        <div class="mt-6 flex gap-4">
            <button onclick="initGame()" class="px-6 py-3 bg-pink-500 hover:bg-pink-600 text-white font-bold rounded-full shadow-lg transform hover:scale-105 transition-all">
                重新洗牌 🔄
            </button>
        </div>
        
        <div id="game-over" class="hidden absolute inset-0 bg-black/60 flex flex-col items-center justify-center z-50 backdrop-blur-sm">
            <div class="bg-white p-8 rounded-3xl text-center shadow-2xl">
                <h2 class="text-4xl font-black text-pink-600 mb-2">清盘达成！</h2>
                <p class="text-gray-600 mb-6 font-bold">最终得分: <span id="final-score" class="text-pink-500 text-2xl">0</span></p>
                <button onclick="initGame()" class="px-8 py-4 bg-pink-500 hover:bg-pink-600 text-white text-xl font-bold rounded-full shadow-lg">
                    再来一把！
                </button>
            </div>
        </div>
    </div>

    <script>
        const ROWS = 8;
        const COLS = 8;
        
        // 这里的路径建议使用相对路径，或者图床链接
        const FACES = [
            '<img src="face1.jpg">',
            '<img src="face2.jpg">',
            '<img src="face3.jpg">'
        ];

        let board = [];
        let score = 0;
        const boardElement = document.getElementById('game-board');
        const scoreElement = document.getElementById('score');
        const gameOverPanel = document.getElementById('game-over');
        const finalScoreElement = document.getElementById('final-score');

        // 音效播放函数
        function playSound(id) {
            const sound = document.getElementById(id);
            sound.currentTime = 0;
            sound.play().catch(e => console.log("等待交互后播放音效"));
        }

        function initGame() {
            boardElement.style.gridTemplateColumns = `repeat(${COLS}, minmax(0, 1fr))`;
            score = 0;
            updateScore();
            gameOverPanel.classList.add('hidden');
            board = Array.from({ length: COLS }, () => 
                Array.from({ length: ROWS }, () => FACES[Math.floor(Math.random() * FACES.length)])
            );
            renderBoard();
        }

        function renderBoard() {
            boardElement.innerHTML = '';
            for (let y = ROWS - 1; y >= 0; y--) {
                for (let x = 0; x < COLS; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    const face = board[x][y];
                    if (face) {
                        tile.innerHTML = face;
                        tile.onclick = () => handleTileClick(x, y);
                    } else {
                        tile.classList.add('empty');
                    }
                    boardElement.appendChild(tile);
                }
            }
        }

        async function handleTileClick(x, y) {
            const faceType = board[x][y];
            if (!faceType) return;

            const connected = [];
            const visited = new Set();
            
            function findConnected(cx, cy) {
                const key = `${cx},${cy}`;
                if (cx < 0 || cx >= COLS || cy < 0 || cy >= ROWS || visited.has(key) || board[cx][cy] !== faceType) return;
                visited.add(key);
                connected.push({x: cx, y: cy});
                findConnected(cx + 1, cy);
                findConnected(cx - 1, cy);
                findConnected(cx, cy + 1);
                findConnected(cx, cy - 1);
            }

            findConnected(x, y);

            if (connected.length >= 2) {
                playSound('sound-pop'); // 播放消除音
                score += connected.length * connected.length * 10;
                updateScore();

                const tiles = document.querySelectorAll('.tile');
                connected.forEach(pos => {
                    board[pos.x][pos.y] = null;
                    const domIndex = (ROWS - 1 - pos.y) * COLS + pos.x;
                    if(tiles[domIndex]) tiles[domIndex].classList.add('popping');
                });

                await new Promise(r => setTimeout(r, 300));
                applyGravity();
                shiftLeft();
                renderBoard();
                checkGameOver();
            } else {
                playSound('sound-click'); // 播放普通点击音
                // 反馈动画...
            }
        }

        function applyGravity() {
            for (let x = 0; x < COLS; x++) {
                let colFaces = board[x].filter(f => f !== null);
                while (colFaces.length < ROWS) colFaces.push(null);
                board[x] = colFaces;
            }
        }

        function shiftLeft() {
            let newBoard = board.filter(col => col.some(f => f !== null));
            while (newBoard.length < COLS) newBoard.push(Array(ROWS).fill(null));
            board = newBoard;
        }

        function checkGameOver() {
            let hasMoves = false;
            let totalRemaining = 0;
            for (let x = 0; x < COLS; x++) {
                for (let y = 0; y < ROWS; y++) {
                    if (board[x][y]) {
                        totalRemaining++;
                        if (x < COLS - 1 && board[x][y] === board[x + 1][y]) hasMoves = true;
                        if (y < ROWS - 1 && board[x][y] === board[x][y + 1]) hasMoves = true;
                    }
                }
            }

            if (!hasMoves) {
                if (totalRemaining === 0) {
                    score += 2000;
                    updateScore();
                    playSound('sound-win');
                }
                setTimeout(() => {
                    finalScoreElement.innerText = score;
                    gameOverPanel.classList.remove('hidden');
                }, 500);
            }
        }

        function updateScore() {
            scoreElement.innerText = score;
        }

        initGame();
    </script>
</body>
</html>
