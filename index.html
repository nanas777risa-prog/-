<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lena消消消</title>
    <style>
        /* 移除外部库，纯本地 CSS 加速 */
        body { background-color: #fce7f3; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; user-select: none; }
        .header { width: 90%; max-width: 400px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        h1 { color: #db2777; margin: 0; font-size: 24px; }
        #score { font-size: 30px; color: #ec4899; font-weight: bold; }
        #game-board { 
            display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; 
            background-color: #fbcfe8; padding: 8px; border-radius: 16px; 
            width: 90vw; max-width: 400px; box-sizing: border-box;
        }
        .tile { 
            width: 100%; aspect-ratio: 1/1; background-color: white; 
            border-radius: 8px; cursor: pointer; overflow: hidden; display: flex;
        }
        /* 亮度下调至 1.1 */
        .tile img { width: 100%; height: 100%; object-fit: cover; filter: brightness(1.1); pointer-events: none; }
        .tile.empty { background-color: transparent; cursor: default; }
        .btn { 
            margin-top: 20px; padding: 12px 24px; background-color: #ec4899; 
            color: white; border: none; border-radius: 25px; font-weight: bold; font-size: 16px;
        }
        #game-over { 
            position: absolute; inset: 0; background: rgba(0,0,0,0.6); 
            display: none; flex-direction: column; align-items: center; justify-content: center; color: white;
        }
        .modal { background: white; padding: 30px; border-radius: 20px; text-align: center; color: #db2777; }
    </style>
</head>
<body>

    <audio id="snd-pop" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

    <div class="header">
        <div>
            <h1>Lena消消消</h1>
            <p style="color:#f472b6; margin:0; font-size:12px;">点相连的同款头像！</p>
        </div>
        <div id="score">0</div>
    </div>

    <div id="game-board"></div>
    <button class="btn" onclick="initGame()">重新洗牌 🔄</button>

    <div id="game-over">
        <div class="modal">
            <h2 id="over-title">游戏结束</h2>
            <button class="btn" onclick="initGame()">再来一把</button>
        </div>
    </div>

    <script>
        const ROWS = 8, COLS = 8;
        const FACES = ['face1.jpg', 'face2.jpg', 'face3.jpg'];
        let board = [], score = 0;

        // 仅保留消除音效，且优化播放逻辑防止延迟
        function playPop() { 
            const s = document.getElementById('snd-pop');
            s.currentTime = 0;
            s.play().catch(()=>{});
        }

        function initGame() {
            score = 0; 
            document.getElementById('score').innerText = '0';
            document.getElementById('game-over').style.display = 'none';
            board = Array.from({length: COLS}, () => 
                Array.from({length: ROWS}, () => FACES[Math.floor(Math.random()*FACES.length)])
            );
            renderBoard();
        }

        function renderBoard() {
            const el = document.getElementById('game-board');
            el.innerHTML = '';
            for (let y = ROWS-1; y>=0; y--) {
                for (let x=0; x<COLS; x++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile' + (board[x][y] ? '' : ' empty');
                    if(board[x][y]) {
                        tile.innerHTML = `<img src="${board[x][y]}">`;
                        tile.onclick = () => handleAction(x, y);
                    }
                    el.appendChild(tile);
                }
            }
        }

        function handleAction(x, y) {
            const type = board[x][y];
            if(!type) return;
            const connected = [];
            const visited = new Set();
            const find = (cx, cy) => {
                const k = `${cx},${cy}`;
                if(cx<0||cx>=COLS||cy<0||cy>=ROWS||visited.has(k)||board[cx][cy]!==type) return;
                visited.add(k); connected.push({x:cx, y:cy});
                find(cx+1, cy); find(cx-1, cy); find(cx, cy+1); find(cx, cy-1);
            };
            find(x, y);

            if(connected.length >= 2) {
                playPop();
                score += connected.length * 10;
                document.getElementById('score').innerText = score;
                connected.forEach(p => board[p.x][p.y] = null);
                
                // 物理掉落逻辑直接同步运行，不给白屏留机会
                for(let i=0; i<COLS; i++) {
                    let col = board[i].filter(f => f !== null);
                    while(col.length < ROWS) col.push(null);
                    board[i] = col;
                }
                let activeCols = board.filter(c => c.some(f => f !== null));
                while(activeCols.length < COLS) activeCols.push(Array(ROWS).fill(null));
                board = activeCols;

                renderBoard();
                checkGameOver();
            }
        }

        function checkGameOver() {
            let moves = false, count = 0;
            for(let x=0; x<COLS; x++) {
                for(let y=0; y<ROWS; y++) {
                    if(board[x][y]) {
                        count++;
                        if(x<COLS-1 && board[x][y]===board[x+1][y]) moves = true;
                        if(y<ROWS-1 && board[x][y]===board[x][y+1]) moves = true;
                    }
                }
            }
            if(!moves) {
                document.getElementById('over-title').innerText = count === 0 ? "完美清盘！" : "无路可消";
                document.getElementById('game-over').style.display = 'flex';
            }
        }
        initGame();
    </script>
</body>
</html>
